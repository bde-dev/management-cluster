---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-server-admin-password
  namespace: argocd
spec:
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: admin.password
      remoteRef:
        key: argocd-server-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-private-cluster-credentials-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: private-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          infra/cloudnative-pg: "true"
      type: Opaque
      data:
        name: "private-cluster"
        server: "https://{{ .apiServerHost }}:6443"
        config: |
          {
            "bearerToken": "{{ .bearerToken }}",
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData | b64enc }}"
            }
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: argocd-private-cluster-token
    - secretKey: caData
      remoteRef:
        key: argocd-private-cluster-ca-cert
    - secretKey: apiServerHost
      remoteRef:
        key: argocd-private-cluster-api-host
