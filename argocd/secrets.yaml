apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-cloudflare-tunnel-token
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: argocd-cloudflare-tunnel-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-management-repo-creds-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-management-repo-creds-github
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/bde-dev/management-cluster.git
        username: "{{ .githubManagementRepoUsername }}"
        password: "{{ .githubManagementRepoPatToken }}"
  data:
    - secretKey: githubManagementRepoUsername
      remoteRef:
        key: github-management-repo-username
    - secretKey: githubManagementRepoPatToken
      remoteRef:
        key: github-management-repo-pat-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-private-repo-creds-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
