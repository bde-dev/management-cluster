global:
  domain: argocd.bde-dev.net

configs:
  params:
    server.insecure: "true"
    controller.diff.server.side: "true"
    controller.status.processors: "5"
    controller.operation.processors: "5"

  secret:
    createSecret: false

  cm:
    kustomize.buildOptions: --enable-helm
    # Reconcile every 10m with jitter instead of the 3m default: three cluster
    # caches refreshing in lockstep is the controller's dominant load spike.
    timeout.reconciliation: 600s
    timeout.reconciliation.jitter: 120s
    # High-churn, zero-value resources are excluded from the cluster cache -
    # each entry here is memory the controller never allocates across all
    # managed clusters.
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
      - apiGroups:
          - ""
          - events.k8s.io
        kinds:
          - Event
        clusters:
          - "*"
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
        clusters:
          - "*"

controller:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  env:
    # ~85% of the 1Gi limit: the Go runtime GCs aggressively at this ceiling
    # instead of running into the cgroup wall and being OOM-killed. request=
    # limit below keeps memory QoS Guaranteed, so the node is never pressured.
    - name: GOMEMLIMIT
      value: 850MiB
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
