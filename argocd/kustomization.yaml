apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - secrets.yaml
  - cloudflare.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 3.35.4
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
