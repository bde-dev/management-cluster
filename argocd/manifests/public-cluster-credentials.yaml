apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-public-cluster-credentials-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: public-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          infra/cloudnative-pg: "true"
        annotations:
          clustermesh_name: "public"
          clustermesh_id: "3"
      type: Opaque
      data:
        name: "public-cluster"
        server: "https://{{ .apiServerHost }}:6443"
        config: |
          {
            "bearerToken": "{{ .bearerToken }}",
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData | b64enc }}"
            }
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: argocd-public-cluster-token
    - secretKey: caData
      remoteRef:
        key: argocd-public-cluster-ca-cert
    - secretKey: apiServerHost
      remoteRef:
        key: argocd-public-cluster-api-host
