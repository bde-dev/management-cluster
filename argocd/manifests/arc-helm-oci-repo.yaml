# Registers the public ARC OCI Helm registry with ArgoCD (enableOCI) so the
# gha-runner-scale-set-controller / gha-runner-scale-set Applications can pull
# their charts. Anonymous access — no credentials, so a plain Secret (mirrors
# in-cluster.yaml, not the ExternalSecret repo-creds pattern).
apiVersion: v1
kind: Secret
metadata:
  name: arc-helm-oci-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: actions-runner-controller
  url: ghcr.io/actions/actions-runner-controller-charts
  type: helm
  enableOCI: "true"
