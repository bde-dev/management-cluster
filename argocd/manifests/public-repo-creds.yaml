apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-public-repo-creds-github
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-public-repo-creds-github
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/bde-dev/public-cluster.git
        username: "{{ .githubpublicRepoUsername }}"
        password: "{{ .githubpublicRepoPatToken }}"
  data:
    - secretKey: githubpublicRepoUsername
      remoteRef:
        key: github-public-repo-username
    - secretKey: githubpublicRepoPatToken
      remoteRef:
        key: github-public-repo-pat-token
