apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-server-admin-password
  namespace: argocd
spec:
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: admin.password
      remoteRef:
        key: argocd-server-admin-password
