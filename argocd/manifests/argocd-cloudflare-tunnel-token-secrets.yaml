apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-cloudflare-tunnel-token
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: argocd-cloudflare-tunnel-token
