# TODO(pre-hardware): the three Key Vault secrets referenced below
# (argocd-runners-cluster-{token,ca-cert,api-host}) do not exist until the
# runners cluster is provisioned and `mise run store-cluster-creds` has run
# against it. Until then this ExternalSecret stays unresolved and the cluster
# is simply not registered — no other action needed once the secrets land.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-runners-cluster-credentials-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: runners-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          otel-role: satellite
        annotations:
          clustermesh_name: "runners"
          clustermesh_id: "4"
      type: Opaque
      data:
        name: "runners-cluster"
        server: "https://{{ .apiServerHost }}:6443"
        config: |
          {
            "bearerToken": "{{ .bearerToken }}",
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData | b64enc }}"
            }
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: argocd-runners-cluster-token
    - secretKey: caData
      remoteRef:
        key: argocd-runners-cluster-ca-cert
    - secretKey: apiServerHost
      remoteRef:
        key: argocd-runners-cluster-api-host
