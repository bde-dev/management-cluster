apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-private-cluster-credentials-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: private-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          infra/cloudnative-pg: "true"
        annotations:
          clustermesh_name: "private"
          clustermesh_id: "2"
      type: Opaque
      data:
        name: "private-cluster"
        server: "https://{{ .apiServerHost }}:6443"
        config: |
          {
            "bearerToken": "{{ .bearerToken }}",
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{ .caData | b64enc }}"
            }
          }
  data:
    - secretKey: bearerToken
      remoteRef:
        key: argocd-private-cluster-token
    - secretKey: caData
      remoteRef:
        key: argocd-private-cluster-ca-cert
    - secretKey: apiServerHost
      remoteRef:
        key: argocd-private-cluster-api-host
