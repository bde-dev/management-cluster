apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: management-root-app
  namespace: argocd
  labels:
    category: root-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: management

  source:
    repoURL: https://github.com/bde-dev/management-cluster.git
    targetRevision: HEAD
    path: applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
