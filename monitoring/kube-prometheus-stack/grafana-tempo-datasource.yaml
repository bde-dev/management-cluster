apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tempo-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"        # grafana-sc-datasources sidecar auto-loads + hot-reloads
data:
  tempo-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring:3200/
      access: proxy
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus     # service graph (fed by Tempo metrics-generator)
        tracesToMetrics:
          datasourceUid: prometheus     # jump trace -> metrics on the kps Prometheus
          tags:
            - key: service.name
              value: service_name
        tracesToLogsV2:
          datasourceUid: loki           # jump trace -> its logs in Loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          tags:
            - key: service.name
              value: service_name
