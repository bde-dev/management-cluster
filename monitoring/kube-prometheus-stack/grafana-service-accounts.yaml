apiVersion: generators.external-secrets.io/v1alpha1
kind: Grafana
metadata:
  name: grafana-sa-lawrence
  namespace: monitoring
spec:
  url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
  auth:
    basic:
      username: grafana
      password:
        name: grafana-admin-secrets
        key: admin-password
  serviceAccount:
    name: lawrence
    role: Admin
    secondsToLive: 10800
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-sa-lawrence-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  target:
    name: grafana-sa-lawrence-token
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Grafana
          name: grafana-sa-lawrence
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-sa-lawrence-token
  namespace: monitoring
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: azure-kv-store-homelab
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-sa-lawrence-token
  data:
    - conversionStrategy: None
      match:
        secretKey: token
        remoteRef:
          remoteKey: grafana-sa-lawrence-token
