apiVersion: v1
kind: ConfigMap
metadata:
  name: workstation-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  workstation-dashboard.json: |
    {
      "uid": "workstation",
      "title": "Workstation",
      "tags": [
        "workstation",
        "otel",
        "hostmetrics"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "workstation",
            "label": "Workstation",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(system_cpu_logical_count, workstation)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "bluefin",
              "value": "bluefin"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "CPU",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "type": "gauge",
          "title": "CPU busy",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - sum(rate(system_cpu_time_seconds_total{workstation=~\"$workstation\",state=\"idle\"}[$__rate_interval])) / sum(rate(system_cpu_time_seconds_total{workstation=~\"$workstation\"}[$__rate_interval])))",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU by state",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 30,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (state) (rate(system_cpu_time_seconds_total{workstation=~\"$workstation\",state!=\"idle\"}[$__rate_interval])) / scalar(sum(rate(system_cpu_time_seconds_total{workstation=~\"$workstation\"}[$__rate_interval])))",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Load average (12 logical cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "cores"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        4,
                        4
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "system_cpu_load_average_1m{workstation=~\"$workstation\"}",
              "legendFormat": "1m"
            },
            {
              "refId": "B",
              "expr": "system_cpu_load_average_5m{workstation=~\"$workstation\"}",
              "legendFormat": "5m"
            },
            {
              "refId": "C",
              "expr": "system_cpu_load_average_15m{workstation=~\"$workstation\"}",
              "legendFormat": "15m"
            },
            {
              "refId": "D",
              "expr": "system_cpu_logical_count{workstation=~\"$workstation\"}",
              "legendFormat": "cores"
            }
          ]
        },
        {
          "type": "row",
          "title": "Memory",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Memory available",
          "description": "Kernel MemAvailable (limit − used): what a new process can actually claim. Linux keeps 'free' near zero by design — cache is reclaimed on demand.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 2147483648
                  },
                  {
                    "color": "green",
                    "value": 4294967296
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "system_memory_limit_bytes{workstation=~\"$workstation\"} - on(workstation) sum by (workstation) (system_memory_usage_bytes{workstation=~\"$workstation\",state=\"used\"})"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory composition",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 4,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 40,
                "lineWidth": 0,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "total RAM"
                },
                "properties": [
                  {
                    "id": "custom.stacking",
                    "value": {
                      "mode": "none"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        4,
                        4
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (state) (system_memory_usage_bytes{workstation=~\"$workstation\",state=~\"used|cached|buffered|free\"})",
              "legendFormat": "{{state}}"
            },
            {
              "refId": "B",
              "expr": "system_memory_limit_bytes{workstation=~\"$workstation\"}",
              "legendFormat": "total RAM"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Swap",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 30,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (state) (system_paging_usage_bytes{workstation=~\"$workstation\"})",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Processes",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "collapsed": false
        },
        {
          "type": "bargauge",
          "title": "Top 10 memory by process",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "lcd",
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "sortBy": "Last *",
            "sortDesc": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (process_executable_name) (process_memory_usage_bytes{workstation=~\"$workstation\"}))",
              "legendFormat": "{{process_executable_name}}",
              "instant": true
            }
          ]
        },
        {
          "type": "bargauge",
          "title": "Top 10 CPU by process",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 12,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "lcd",
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "sortBy": "Last *",
            "sortDesc": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, 100 * sum by (process_executable_name) (rate(process_cpu_time_seconds_total{workstation=~\"$workstation\"}[$__rate_interval])))",
              "legendFormat": "{{process_executable_name}}",
              "instant": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Processes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 4,
            "x": 20,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(system_processes_count{workstation=~\"$workstation\"})",
              "instant": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Disk & Network",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "collapsed": false
        },
        {
          "type": "bargauge",
          "title": "Filesystem used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "lcd",
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "sortBy": "Last *",
            "sortDesc": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (mountpoint) (system_filesystem_usage_bytes{workstation=~\"$workstation\",state=\"used\"}) / sum by (mountpoint) (system_filesystem_usage_bytes{workstation=~\"$workstation\"})",
              "legendFormat": "{{mountpoint}}",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Disk I/O",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (direction) (rate(system_disk_io_bytes_total{workstation=~\"$workstation\"}[$__rate_interval]))",
              "legendFormat": "{{direction}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network I/O (excl. lo)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 29
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (direction) (rate(system_network_io_bytes_total{workstation=~\"$workstation\",device!=\"lo\"}[$__rate_interval]))",
              "legendFormat": "{{direction}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Containers",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "collapsed": false
        },
        {
          "type": "bargauge",
          "title": "Top 10 containers by memory",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 38
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "lcd",
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "sortBy": "Last *",
            "sortDesc": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (container_name) (container_memory_usage_total_bytes{workstation=~\"$workstation\"}))",
              "legendFormat": "{{container_name}}",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Container CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container_name) (container_cpu_utilization_ratio{workstation=~\"$workstation\"})",
              "legendFormat": "{{container_name}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Kernel log (dmesg via journald)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 46
          },
          "collapsed": false
        },
        {
          "type": "logs",
          "title": "Kernel log",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 47
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service_name=~\"workstation-$workstation\"} | json | line_format \"{{.SYSLOG_IDENTIFIER}}: {{.MESSAGE}}\""
            }
          ]
        }
      ]
    }
