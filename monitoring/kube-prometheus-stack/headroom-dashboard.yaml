apiVersion: v1
kind: ConfigMap
metadata:
  name: headroom-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  headroom-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * k8s_node_memory_working_set_bytes{k8s_cluster_name=~\"$cluster\"} / on(k8s_cluster_name, k8s_node_name) k8s_node_allocatable_memory_bytes{k8s_cluster_name=~\"$cluster\"}",
              "legendFormat": "{{k8s_cluster_name}}/{{k8s_node_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Memory Used %",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Actual - Requested"
              }
            ]
          },
          "pluginVersion": "13.0.2",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum by (k8s_cluster_name, k8s_namespace_name) (k8s_container_memory_request_bytes{k8s_cluster_name=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{k8s_cluster_name}}/{{k8s_namespace_name}}",
              "range": false,
              "refId": "Requested"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum by (k8s_cluster_name, k8s_namespace_name) (k8s_container_memory_limit_bytes{k8s_cluster_name=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{k8s_cluster_name}}/{{k8s_namespace_name}}",
              "range": false,
              "refId": "Limit"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "sum by (k8s_cluster_name, k8s_namespace_name) (k8s_pod_memory_working_set_bytes{k8s_cluster_name=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{k8s_cluster_name}}/{{k8s_namespace_name}}",
              "range": false,
              "refId": "Actual"
            }
          ],
          "title": "Requests vs Limits",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "includeByName": {},
                "indexByName": {},
                "renameByName": {
                  "Value #Actual": "Actual",
                  "Value #Limit": "Limit",
                  "Value #Requested": "Requested"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "binary": {
                  "left": {
                    "matcher": {
                      "id": "byName",
                      "options": "Actual"
                    }
                  },
                  "operator": "-",
                  "right": {
                    "matcher": {
                      "id": "byName",
                      "options": "Requested"
                    }
                  }
                },
                "mode": "binary",
                "reduce": {
                  "reducer": "sum"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "preload": false,
      "refresh": "",
      "schemaVersion": 42,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "Headroom dashboard",
      "uid": "grng6sk",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(k8s_node_allocatable_memory_bytes, k8s_cluster_name)",
            "query": {
              "qryType": 1,
              "query": "label_values(k8s_node_allocatable_memory_bytes, k8s_cluster_name)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "hide": 0
          }
        ]
      }
    }
