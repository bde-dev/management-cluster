apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        network-policy-type: cloudflared
    spec:
      imagePullSecrets:
        - name: harbor-registry-creds
      containers:
        - image: docker.io/cloudflare/cloudflared:2026.10.3
          name: cloudflared
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloudflare-tunnel-token
                  key: token
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - debug
            - --metrics
            - 0.0.0.0:2000
            - run

          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
