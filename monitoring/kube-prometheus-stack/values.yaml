crds:
  enabled: true

alertmanager:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  service:
    annotations:
      service.cilium.io/global: "true"
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    enableOTLPReceiver: true
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
    otlp:
      translationStrategy: UnderscoreEscapingWithSuffixes
      promoteAllResourceAttributes: true
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

grafana:
  enabled: true
  defaultDashboardsEnabled: false # OTel-native: drop the kps mixin dashboards (replaced by OTel dashboards + a standalone apiserver dashboard)
  admin:
    existingSecret: grafana-admin-secrets
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    service_accounts:
      token_expiration_day_limit: 30
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: traceID
        urlDisplayLabel: View trace

kubelet:
  enabled: false # OTel kubeletstats covers pod/container metrics — cut to end double-collection
kubeApiServer:
  enabled: true # KEEP — control-plane has no OTel scrape equivalent
kubeStateMetrics:
  enabled: false # OTel k8s_cluster covers node/pod/cluster objects; OTel dashboards use zero kube_*
nodeExporter:
  enabled: false # OTel hostmetrics covers host CPU/mem/disk/net

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
