crds:
  enabled: true

alertmanager:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    enableOTLPReceiver: true
    enableRemoteWriteReceiver: true
    enableFeatures:
    - exemplar-storage
    otlp:
      translationStrategy: UnderscoreEscapingWithSuffixes
      promoteAllResourceAttributes: true
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-secrets
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: traceID
        urlDisplayLabel: View trace

kubelet:
  enabled: true
kubeApiServer:
  enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
