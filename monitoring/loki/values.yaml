deploymentMode: SingleBinary

service:
  annotations:
    service.cilium.io/global: "true"

loki:
  auth_enabled: false
  useTestSchema: true
  storage:
    type: filesystem
  commonConfig:
    replication_factor: 1

singleBinary:
  replicas: 1
  persistence:
    enabled: false

read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }
