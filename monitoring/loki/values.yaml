deploymentMode: SingleBinary

loki:
  auth_enabled: false
  useTestSchema: true
  storage:
    type: filesystem
  commonConfig:
    replication_factor: 1

SingleBinary:
  replicas: 1

read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
gateway: { enabled: false }
minio: { enabled: false }
