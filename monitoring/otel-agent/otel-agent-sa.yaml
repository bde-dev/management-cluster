apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-collector-cr
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "namespaces", "pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-collector-crb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-collector-cr
subjects:
  - kind: ServiceAccount
    name: otel-agent-collector
    namespace: monitoring
