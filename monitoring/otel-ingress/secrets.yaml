apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-cloudflare-tunnel-token
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: otel-cloudflare-tunnel-token
  data:
    - secretKey: token
      remoteRef:
        key: otel-cloudflare-tunnel-token
