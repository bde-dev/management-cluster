apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wallabag
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    category: app

spec:
  project: public

  sources:
    - repoURL: https://github.com/bde-dev/public-cluster.git
      targetRevision: HEAD
      path: apps/wallabag

  destination:
    name: public-cluster
    namespace: wallabag

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
