apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mealie
  namespace: argocd
  labels:
    category: app

spec:
  project: public

  sources:
    - repoURL: https://github.com/bde-dev/public-cluster.git
      targetRevision: HEAD
      path: apps/mealie

  destination:
    name: public-cluster
    namespace: mealie

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
