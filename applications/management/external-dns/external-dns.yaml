apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: management-external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: management

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: v1.15.0
      helm:
        valuesFiles:
          - values.yaml

    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: infrastructure/external-dns

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
