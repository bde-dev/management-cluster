apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd
  namespace: argocd
  labels:
    category: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "5"

spec:
  project: management

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.3.7
      helm:
        valueFiles:
          - $values/argocd/values.yaml

    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: argocd
      ref: values

    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: argocd/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
