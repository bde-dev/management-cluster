apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: private-apps-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    category: root-app

spec:
  project: private

  sources:
    - repoURL: https://github.com/bde-dev/private-cluster.git
      targetRevision: HEAD
      path: argocd/apps
      directory:
        recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
