apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: paperless
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    category: app

spec:
  project: private

  sources:
    - repoURL: https://github.com/bde-dev/private-cluster.git
      targetRevision: HEAD
      path: apps/paperless

  destination:
    name: private-cluster
    namespace: paperless

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
