apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: harbor
  namespace: argocd
  labels:
    category: infrastructure

spec:
  project: management

  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.18.3
      helm:
        valueFiles:
          - $values/infrastructure/harbor/values.yaml
    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: infrastructure/harbor
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: harbor

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
