apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-external-dns"
      labels:
        category: infrastructure

    spec:
      project: infrastructure

      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns/
          chart: external-dns
          targetRevision: 1.22.0
          helm:
            valueFiles:
              - $values/infrastructure/external-dns/values.yaml
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/external-dns
          ref: values

      destination:
        server: "{{server}}"
        namespace: external-dns

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
