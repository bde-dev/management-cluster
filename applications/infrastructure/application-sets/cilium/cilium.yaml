apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-cilium"

    spec:
      project: infrastructure

      sources:
        - repoURL: https://helm.cilium.io/
          chart: cilium
          targetRevision: 1.19.2
          helm:
            valueFiles:
              - $values/infrastructure/cilium/values.yaml
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/cilium
          ref: values

      destination:
        server: "{{server}}"
        namespace: kube-system

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
