apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd

spec:
  # Used to catch missing clustermesh_* annotations below
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{.name}}-cilium"

    spec:
      project: infrastructure

      sources:
        - repoURL: https://helm.cilium.io/
          chart: cilium
          targetRevision: 1.18.1
          helm:
            valueFiles:
              - $values/infrastructure/cilium/values.yaml
            parameters:
              - name: cluster.name
                value: "{{ .metadata.annotations.clustermesh_name }}"
              - name: cluster.id
                value: "{{ .metadata.annotations.clustermesh_id }}"
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          ref: values

      destination:
        server: "{{.server}}"
        namespace: kube-system

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
