apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            infra/cloudnative-pg: "true"

  template:
    metadata:
      name: "{{name}}-cloudnative-pg"
      labels:
        category: infrastructure

    spec:
      project: infrastructure

      sources:
        - repoURL: https://cloudnative-pg.github.io/charts/
          chart: cloudnative-pg
          targetRevision: "0.29.0"
          helm:
            valuesObject:
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 50m
                  memory: 128Mi
        - repoURL: https://cloudnative-pg.github.io/charts/
          chart: plugin-barman-cloud
          targetRevision: "0.8.1"
          helm:
            releaseName: plugin-barman-cloud
            valuesObject:
              logLevel: info
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 50m
                  memory: 128Mi
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/cloudnative-pg

      destination:
        server: "{{server}}"
        namespace: cnpg-system

      syncPolicy:
        automated:
          selfHeal: true
          prune: true

        syncOptions:
          - ServerSideApply=true
