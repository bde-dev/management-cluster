apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-cert-manager"

    spec:
      project: infrastructure

      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: "v1.18.0"
          helm:
            valuesObject:
              installCRDs: true
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/cert-manager

      destination:
        server: "{{server}}"
        namespace: cert-manager

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
