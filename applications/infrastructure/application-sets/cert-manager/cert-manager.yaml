apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-cert-manager"
      labels:
        category: infrastructure

    spec:
      project: infrastructure

      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: "v1.18.0"
          helm:
            valuesObject:
              installCRDs: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 50m
                  memory: 128Mi
              cainjector:
                resources:
                  requests:
                    cpu: 10m
                    memory: 96Mi
                  limits:
                    cpu: 50m
                    memory: 192Mi
              webhook:
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 50m
                    memory: 64Mi
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/cert-manager

      destination:
        server: "{{server}}"
        namespace: cert-manager

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
