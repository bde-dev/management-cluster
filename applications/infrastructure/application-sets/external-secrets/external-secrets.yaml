apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-external-secrets"

    spec:
      project: infrastructure

      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.18.2
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/external-secrets

      destination:
        server: "{{server}}"
        namespace: external-secrets

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
