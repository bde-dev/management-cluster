apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-external-secrets"
      labels:
        category: infrastructure

    spec:
      project: infrastructure

      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.20.4
          helm:
            valuesObject:
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 50m
                  memory: 128Mi
              certController:
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    cpu: 100m
                    memory: 192Mi
              webhook:
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    cpu: 50m
                    memory: 96Mi
        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: infrastructure/external-secrets

      destination:
        server: "{{server}}"
        namespace: external-secrets

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
