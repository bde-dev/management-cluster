apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    category: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: monitoring

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.4.2
      helm:
        valueFiles:
          - $values/monitoring/loki/values.yaml

    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: monitoring/loki
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
