apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: otel-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  generators:
    - clusters: {}

  template:
    metadata:
      name: "{{name}}-otel-operator"
      labels:
        category: monitoring
        sub-category: otel

    spec:
      project: monitoring

      sources:
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-operator
          targetRevision: 0.120.3
          helm:
            valuesObject:
              admissionWebhooks:
                certManager:
                  enabled: true

        - repoURL: https://github.com/bde-dev/management-cluster.git
          targetRevision: HEAD
          path: monitoring/otel-operator

      destination:
        server: "{{server}}"
        namespace: opentelemetry-operator-system

      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
