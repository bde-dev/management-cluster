apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tempo
  namespace: argocd
  labels:
    category: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: monitoring

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 2.2.3
      helm:
        valueFiles:
          - $values/monitoring/tempo/values.yaml

    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: monitoring/tempo
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
