apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-aggregator
  namespace: argocd
  labels:
    category: monitoring
    sub-category: otel
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: monitoring

  sources:
    - repoURL: https://github.com/bde-dev/management-cluster.git
      targetRevision: HEAD
      path: monitoring/otel-aggregator

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
