apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gha-runner-scale-set-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    category: app
  annotations:
    # Controller (and its CRDs) must land before the gha-runner-scale-set app
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: runners

  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.14.2
      helm:
        valueFiles:
          - $values/apps/gha-runner-scale-set-controller/values.yaml
    - repoURL: https://github.com/bde-dev/runners-cluster.git
      targetRevision: HEAD
      path: apps/gha-runner-scale-set-controller
      ref: values

  destination:
    name: runners-cluster
    namespace: arc-systems

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
