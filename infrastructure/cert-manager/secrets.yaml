apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: cloudflare-dns-api-token
      remoteRef:
        key: cloudflare-dns-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-cilium-shared-ca
  namespace: cert-manager
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  target:
    name: homelab-cilium-shared-ca
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .pfx | pkcs12cert }}"
        tls.key: "{{ .pfx | pkcs12key }}"
  data:
    - secretKey: pfx
      remoteRef:
        key: homelab-cilium-shared-ca
