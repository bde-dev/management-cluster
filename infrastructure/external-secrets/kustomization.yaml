apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

resources:
  - namespace.yaml

helmCharts:
  - name: external-secrets
    repo: https://github.com/external-secrets/external-secrets
    version: 0.18.2
    releaseName: external-secrets
    namespace: external-secrets
    valuesFile: values.yaml
