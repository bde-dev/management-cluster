apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: runners-pool
spec:
  serviceSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - clustermesh-apiserver
  blocks:
    - start: "192.168.0.211"
      stop: "192.168.0.219"
