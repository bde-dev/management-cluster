expose:
  type: loadBalancer
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls

externalURL: https://harbor.bde-dev.net

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: "synology-iscsi-retain"
      accessMode: ReadWriteOnce
      size: 350Gi
    jobservice:
      jobLog:
        storageClass: "local-path"
        accessMode: ReadWriteOnce
        size: 1Gi
    database:
      existingClaim: "harbor-db-prod-cnpg-v0-1"
    redis:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: 1Gi
    trivy:
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      size: 5Gi

existingSecretAdminPassword: harbor-admin-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

metrics:
  enabled: true

  # serviceMonitor:
  #   enabled: true

trace:
  enabled: true
  provider: otel
  otel:
    endpoint: otel-gateway-collector.monitoring.svc.cluster.local:4318
    url_path: /v1/traces
    compression: false
    insecure: true
    timeout: 10

nginx:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

portal:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

core:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

jobservice:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

registry:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

trivy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  type: external
  external:
    host: harbor-db
    port: "5432"
    username: harbor
    coreDatabase: "harbor"
    existingSecret: "harbor-db-creds"
    sslMode: "disable"

redis:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 128Mi

exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
