apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db-prod-cnpg-v1
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  enablePDB: false

  postgresql:
    parameters:
      max_wal_size: "256MB"
      wal_keep_size: "64MB"

  # monitoring:
  #   enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: harbor-db-barman-store
        serverName: harbor-db-prod-cnpg-v1

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: harbor-db-barman-store
          serverName: harbor-db-prod-cnpg-v0

  bootstrap:
    recovery:
      source: clusterBackup

  storage:
    size: 1Gi

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: harbor-db
            spec:
              type: ClusterIP
