      remoteRef:
        key: harbor-core-secret
    - secretKey: CSRF_KEY
      remoteRef:
        key: harbor-csrf-key
    - secretKey: JOBSERVICE_SECRET
      remoteRef:
        key: harbor-jobservice-secret
    - secretKey: REGISTRY_HTTP_SECRET
      remoteRef:
        key: harbor-registry-http-secret
    - secretKey: REGISTRY_PASSWD
      remoteRef:
        key: harbor-registry-password
    - secretKey: REGISTRY_HTPASSWD
      remoteRef:
        key: harbor-registry-htpasswd
---
