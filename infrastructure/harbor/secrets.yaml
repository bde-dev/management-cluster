apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-internal-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
