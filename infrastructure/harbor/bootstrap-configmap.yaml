apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-bootstrap
  namespace: harbor
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    HARBOR_USER=admin

    # Colors for output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m' # No Color

    log_info() {
      echo -e "${GREEN}[INFO]${NC} $1"
    }

    log_warn() {
      echo -e "${YELLOW}[WARN]${NC} $1"
    }

    log_error() {
      echo -e "${RED}[ERROR]${NC} $1"
    }

    # Check prerequisites
    if [[ -z "${HARBOR_URL}" ]]; then
      log_error "HARBOR_URL environment variable must be set"
      exit 1
    fi

    if [[ -z "${HARBOR_PASSWORD}" ]]; then
      log_error "HARBOR_PASSWORD environment variable must be set"
      exit 1
    fi

    if [[ -z "${HARBOR_USER}" ]]; then
      log_error "HARBOR_USER environment variable must be set"
      exit 1
    fi

    if [[ -z "${ROBOT_SECRET}" ]]; then
      log_error "ROBOT_SECRET environment variable must be set"
      exit 1
    fi

    if ! command -v curl &>/dev/null; then
      log_error "curl is required but not installed"
      exit 1
    fi

    if ! command -v jq &>/dev/null; then
      log_error "jq is required but not installed"
      exit 1
    fi

    # Wait for Harbor to be ready
    log_info "Waiting for Harbor to be ready at ${HARBOR_URL}..."
    MAX_RETRIES=30
    RETRY_COUNT=0

    until curl -sfk "${HARBOR_URL}/api/v2.0/systeminfo" >/dev/null; do
      RETRY_COUNT=$((RETRY_COUNT + 1))
      if [[ ${RETRY_COUNT} -ge ${MAX_RETRIES} ]]; then
        log_error "Harbor failed to become ready after ${MAX_RETRIES} attempts"
        exit 1
      fi
      log_warn "Harbor not ready yet, sleeping 10s... (${RETRY_COUNT}/${MAX_RETRIES})"
      sleep 10
    done

    log_info "Harbor is ready!"

    # Function to create registry endpoint
    create_registry() {
      local name=$1
      local type=$2
      local url=$3
      local description=$4

      log_info "Creating registry endpoint: ${name}"

      local response
      response=$(curl -vvv -s -w "\n%{http_code}" -X POST "${HARBOR_URL}/api/v2.0/registries" --location --insecure \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"${name}\",
          \"type\": \"${type}\",
          \"url\": \"${url}\",
          \"description\": \"${description}\",
          \"insecure\": false
        }")

      log_info "response: $response"

      local http_code=$(echo "$response" | tail -n1)
      local body=$(echo "$response" | sed '$d')

      log_info "http_code: $http_code"
      log_info "body: $body"

      if [[ ${http_code} -eq 201 ]]; then
        log_info "✓ Registry ${name} created successfully"
        return 0
      elif [[ ${http_code} -eq 409 ]]; then
        log_warn "✓ Registry ${name} already exists"
        return 0
      else
        log_error "✗ Failed to create registry ${name} (HTTP ${http_code})"
        echo "${body}" | jq '.' 2>/dev/null || echo "${body}"
        return 1
      fi
    }

    # Function to create proxy cache project
    create_proxy_project() {
      local project_name=$1
      local registry_id=$2

      log_info "Creating proxy cache project: ${project_name}"

      local response
      response=$(curl -v -s -w "\n%{http_code}" -X POST "${HARBOR_URL}/api/v2.0/projects" --location --insecure \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
        -H "Content-Type: application/json" \
        -d "{
          \"project_name\": \"${project_name}\",
          \"registry_id\": ${registry_id},
          \"metadata\": {
            \"public\": \"true\"
          },
          \"storage_limit\": -1
        }")

      local http_code=$(echo "$response" | tail -n1)
      local body=$(echo "$response" | sed '$d')

      if [[ ${http_code} -eq 201 ]]; then
        log_info "✓ Project ${project_name} created successfully"
        return 0
      elif [[ ${http_code} -eq 409 ]]; then
        log_warn "✓ Project ${project_name} already exists"
        return 0
      else
        log_error "✗ Failed to create project ${project_name} (HTTP ${http_code})"
        echo "${body}" | jq '.' 2>/dev/null || echo "${body}"
        return 1
      fi
    }

    # Get registry ID by name
    get_registry_id() {
      local name=$1
      local registry_id

      registry_id=$(curl -sfk "${HARBOR_URL}/api/v2.0/registries" \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" |
        jq -r ".[] | select(.name==\"${name}\") | .id")

      if [[ -z "${registry_id}" ]]; then
        log_error "Could not find registry ID for: ${name}"
        return 1
      fi

      echo "${registry_id}"
    }

    # Function to create a private hosted project
    create_project() {
      local project_name=$1

      log_info "Creating project: ${project_name}"

      local response
      response=$(curl -s -w "\n%{http_code}" -X POST "${HARBOR_URL}/api/v2.0/projects" --location --insecure \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
        -H "Content-Type: application/json" \
        -d "{
          \"project_name\": \"${project_name}\",
          \"metadata\": {
            \"public\": \"false\"
          },
          \"storage_limit\": -1
        }")

      local http_code=$(echo "$response" | tail -n1)
      local body=$(echo "$response" | sed '$d')

      if [[ ${http_code} -eq 201 ]]; then
        log_info "✓ Project ${project_name} created successfully"
        return 0
      elif [[ ${http_code} -eq 409 ]]; then
        log_warn "✓ Project ${project_name} already exists"
        return 0
      else
        log_error "✗ Failed to create project ${project_name} (HTTP ${http_code})"
        echo "${body}" | jq '.' 2>/dev/null || echo "${body}"
        return 1
      fi
    }

    # Function to ensure a project-scoped robot whose secret converges to the AKV value.
    # POST-generated secrets are discarded; the PATCH makes AKV the source of truth,
    # so a fresh cluster reconciles to the same credential CI already holds.
    ensure_robot() {
      local project_name=$1
      local robot_name=$2
      local robot_secret=$3

      log_info "Ensuring robot account: ${robot_name} on ${project_name}"

      local response
      response=$(curl -s -w "\n%{http_code}" -X POST "${HARBOR_URL}/api/v2.0/robots" --location --insecure \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"${robot_name}\",
          \"description\": \"GitHub Actions push/pull for ${project_name}\",
          \"duration\": -1,
          \"level\": \"project\",
          \"permissions\": [{
            \"kind\": \"project\",
            \"namespace\": \"${project_name}\",
            \"access\": [
              {\"resource\": \"repository\", \"action\": \"push\"},
              {\"resource\": \"repository\", \"action\": \"pull\"}
            ]
          }]
        }")

      local http_code=$(echo "$response" | tail -n1)
      local body=$(echo "$response" | sed '$d')

      if [[ ${http_code} -eq 201 ]]; then
        log_info "✓ Robot ${robot_name} created"
      elif [[ ${http_code} -eq 409 ]]; then
        log_warn "✓ Robot ${robot_name} already exists"
      else
        log_error "✗ Failed to create robot ${robot_name} (HTTP ${http_code})"
        echo "${body}" | jq '.' 2>/dev/null || echo "${body}"
        return 1
      fi

      # /projects/{name}/robots does not exist on this Harbor; robots are only
      # listable via /robots with the combined Level+ProjectID query filter
      local project_id
      project_id=$(curl -sfk "${HARBOR_URL}/api/v2.0/projects/${project_name}" \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" | jq -r '.project_id')

      local robot_id
      robot_id=$(curl -sfk "${HARBOR_URL}/api/v2.0/robots?page_size=100&q=Level%3Dproject%2CProjectID%3D${project_id}" \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" |
        jq -r --arg n "+${robot_name}" '.[] | select(.name | endswith($n)) | .id')

      if [[ -z "${robot_id}" ]]; then
        log_error "✗ Could not find robot ID for ${robot_name}"
        return 1
      fi

      local patch_code
      patch_code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "${HARBOR_URL}/api/v2.0/robots/${robot_id}" --location --insecure \
        -u "${HARBOR_USER}:${HARBOR_PASSWORD}" \
        -H "Content-Type: application/json" \
        -d "{\"secret\": \"${robot_secret}\"}")

      if [[ ${patch_code} -eq 200 ]]; then
        log_info "✓ Robot ${robot_name} secret converged to AKV value"
        return 0
      else
        log_error "✗ Failed to set robot ${robot_name} secret (HTTP ${patch_code})"
        return 1
      fi
    }

    # Test proxy cache
    test_pull() {
      local image=$1
      echo "Testing: ${image}"
      if docker pull ${image}; then
        echo "✓ Success: ${image}"
        docker rmi ${image} >/dev/null 2>&1 # Clean up
      else
        echo "✗ Failed: ${image}"
        return 1
      fi
      echo ""
    }

    # Main execution
    log_info "Starting Harbor proxy cache setup..."
    echo ""

    # Create registry endpoints
    log_info "=== Creating Registry Endpoints ==="
    create_registry "dockerhub" "docker-hub" "https://hub.docker.com" "Docker Hub proxy cache"
    create_registry "ghcr" "github-ghcr" "https://ghcr.io" "GitHub Container Registry proxy cache"
    create_registry "quay" "docker-registry" "https://quay.io" "Quay.io proxy cache"
    create_registry "k8s" "docker-registry" "https://registry.k8s.io" "Kubernetes registry proxy cache"
    create_registry "mcr" "azure-acr" "https://mcr.microsoft.com" "Microsoft devcontainers registry proxy cache"

    echo ""
    log_info "Waiting 5 seconds for registries to be fully created..."
    sleep 5

    # Get registry IDs
    log_info "=== Retrieving Registry IDs ==="
    DOCKERHUB_ID=$(get_registry_id "dockerhub")
    GHCR_ID=$(get_registry_id "ghcr")
    QUAY_ID=$(get_registry_id "quay")
    K8S_ID=$(get_registry_id "k8s")
    MCR_ID=$(get_registry_id "mcr")

    log_info "Registry IDs: dockerhub=${DOCKERHUB_ID}, ghcr=${GHCR_ID}, quay=${QUAY_ID}, k8s=${K8S_ID}, mcr=${MCR_ID}"

    echo ""
    # Create proxy cache projects
    log_info "=== Creating Proxy Cache Projects ==="
    create_proxy_project "dockerhub-proxy" "${DOCKERHUB_ID}"
    create_proxy_project "ghcr-proxy" "${GHCR_ID}"
    create_proxy_project "quay-proxy" "${QUAY_ID}"
    create_proxy_project "k8s-proxy" "${K8S_ID}"
    create_proxy_project "mcr-proxy" "${MCR_ID}"

    echo ""
    log_info "=== Creating Hosted Projects ==="
    create_project "devcontainer-images"

    echo ""
    log_info "=== Ensuring Robot Accounts ==="
    ensure_robot "devcontainer-images" "gha" "${ROBOT_SECRET}"


    # echo "=== Testing Harbor Proxy Caches ==="
    # echo ""
    # test_pull "${HARBOR_URL}/dockerhub-proxy/library/hello-world:latest"
    # test_pull "${HARBOR_URL}/ghcr-proxy/jonashackt/hello-world:latest"
    # test_pull "${HARBOR_URL}/quay-proxy/prometheus/busybox:latest"
    # test_pull "${HARBOR_URL}/k8s-proxy/pause:3.9"

    # echo "=== Test Complete ==="

    echo ""
    log_info "=== Setup Complete ==="
    log_info "You can now use your proxy caches:"
    echo "  ${HARBOR_URL}/dockerhub-proxy/library/nginx:latest"
    echo "  ${HARBOR_URL}/ghcr-proxy/owner/image:tag"
    echo "  ${HARBOR_URL}/quay-proxy/org/image:tag"
    echo "  ${HARBOR_URL}/k8s-proxy/image:tag"
    echo "  ${HARBOR_URL}/mcr-proxy/image:tag"
