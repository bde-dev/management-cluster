# Override MTU auto-detection — siderolink (Omni) interface at 1280 causes
# Cilium to set pod MTU too low for QUIC with post-quantum TLS
MTU: 1450

# Pod address allocation delegated to each node in the cluster
ipam:
  mode: kubernetes

# ~~~~~ L2 Announcements configuration ~~~~~~~~~~

# Cilium fully replaces kube-proxy with eBPF service routing
kubeProxyReplacement: true

# API server endpoint — required when kube-proxy is not running
k8sServiceHost: localhost
k8sServicePort: 7445

# Single-node clusters — only one operator replica can bind hostPort
operator:
  replicas: 1

# eBPF config - Talos already mounts cgroup at /sys/fs/cgroup
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos restricts kernel capabilities — must be explicit
# SYS_MODULE deliberately omitted (Talos blocks kernel module loading)
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# API chatter is increased when Cilium runs under L2 Announcements mode
# Limiting the API rate limit avoids introducing throttling
k8sClientRateLimit:
  qps: 20
  burst: 20

# Loadbalancer IPs are generated as a VIP tied to the node
# If a node goes down, Cilium elects another node to host that VIP
# Nodes "announce" to the LAN:
# "If you want to reach IP <loadbalancerIP>, then come to my MAC!"
l2announcements:
  enabled: true

# Extras
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true
  service:
    insecureNodePort: 32519
    secureNodePort: 30620

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      method: certmanager
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: clustermesh-ca-issuer

clustermesh:
  useAPIServer: true
  apiserver:
    service:
      type: LoadBalancer
    tls:
      auto:
        enabled: true
        method: certmanager
        certManagerIssuerRef:
          group: cert-manager.io
          kind: ClusterIssuer
          name: clustermesh-ca-issuer
      server:
        extraIpAddresses:
          - 192.168.0.150
          - 192.168.0.170
          - 192.168.0.180
  config:
    enabled: true
    clusters:
      - { name: management, address: 192.168.0.150, port: 2379 }
      - { name: private, address: 192.168.0.170, port: 2379 }
      - { name: public, address: 192.168.0.180, port: 2379 }
