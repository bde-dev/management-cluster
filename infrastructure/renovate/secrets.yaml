apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-pat-token
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: homelab-renovate-github-pat-token
---
# Registry credential for Renovate's image lookups. Renovate turns
# DOCKER_<HOST>_<FIELD> variables into a docker host rule for that host
# (detectHostRulesFromEnv, set in the configmap); a double underscore stands for
# a hyphen and a single one for a dot. The password is the vault entry the Harbor
# bootstrap job converges the pull-only robot to. The username is not secret and
# sits in the configmap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-harbor-credentials
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: DOCKER_HARBOR_BDE__DEV_NET_PASSWORD
      remoteRef:
        key: harbor-devcontainer-images-robot-creds
