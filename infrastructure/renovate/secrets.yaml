apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-pat-token
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: homelab-renovate-github-pat-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-harbor-credentials
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
  data:
    - secretKey: DOCKER_HARBOR_BDE__DEV_NET_PASSWORD
      remoteRef:
        key: harbor-devcontainer-images-renovate-robot-creds
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-packages-credentials
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store-homelab
    kind: ClusterSecretStore
