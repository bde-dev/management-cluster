apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@hourly"
  # Suspended: 500Mi is below Renovate's viable floor (Node heap = ~half the
  # cgroup limit -> ~256MB heap -> SIGABRT in seconds). Unsuspend only after
  # raising the memory limit; ~1Gi is the empirical minimum for six repos.
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:43.288.0
              envFrom:
                - secretRef:
                    name: renovate-github-pat-token
                - configMapRef:
                    name: renovate-configmap
              resources:
                requests:
                  memory: 500Mi
                  cpu: 250m
                limits:
                  memory: 500Mi

          restartPolicy: Never
