apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  # Nightly, off-hours: a homelab doesn't need hourly dependency PRs, and the
  # single-node clusters appreciate the quiet.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: renovate
              image: renovate/renovate:44.121.4
              envFrom:
                - secretRef:
                    name: renovate-github-pat-token
                - configMapRef:
                    name: renovate-configmap
              # request=limit -> Guaranteed QoS: worst case the job is
              # OOM-killed, the node is never pressured. 1Gi is the empirical
              # floor for the six-repo scan; NODE_OPTIONS in the configmap
              # caps the heap at 768MB, leaving headroom for RSS overhead.
              resources:
                requests:
                  memory: 1Gi
                  cpu: 250m
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: cache
                  mountPath: /tmp/renovate/cache

          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: renovate-cache

          restartPolicy: Never
