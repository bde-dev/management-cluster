apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:43.288.0
              envFrom:
                - secretRef:
                    name: renovate-github-pat-token
                - configMapRef:
                    name: renovate-configmap
              resources:
                requests:
                  memory: 1536Mi
                  cpu: 250m
                limits:
                  memory: 2560Mi

          restartPolicy: Never
