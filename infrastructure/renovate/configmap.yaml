apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-configmap
  namespace: renovate
data:
  RENOVATE_AUTODISCOVER: "false"
  RENOVATE_GIT_AUTHOR: "Renovate Bot <bot@renovateapp.com>"
  RENOVATE_PLATFORM: "github"
  RENOVATE_REPOSITORIES: '["bde-dev/management-cluster", "bde-dev/private-cluster", "bde-dev/public-cluster", "bde-dev/runners-cluster", "bde-dev/talos-configs", "bde-dev/devcontainer-images"]'
  LOG_LEVEL: "info"
  # Explicit Node heap cap under the 1Gi cgroup limit; without it the heap
  # defaults to ~half the limit, which is what made 500Mi unviable.
  NODE_OPTIONS: "--max-old-space-size=768"
  # Throttle per-repo work: limits are per-repository, and 0 means UNLIMITED
  # in Renovate semantics, not off. Branches beyond the concurrent cap are
  # deferred to later runs, so a backlog drains gradually.
  RENOVATE_PR_HOURLY_LIMIT: "10"
  RENOVATE_PR_CONCURRENT_LIMIT: "3"
  RENOVATE_BRANCH_CONCURRENT_LIMIT: "3"
  RENOVATE_PR_COMMITS_PER_RUN_LIMIT: "5"
  RENOVATE_HOST_RULES: '[{"matchHost": "api.github.com", "concurrentRequestLimit": 4, "maxRequestsPerSecond": 2}]'
  RENOVATE_REPOSITORY_CACHE: "enabled"
  # Embedded release notes are what the n8n PR analyzer reasons over; the
  # in-workflow enrichment only covers packages with literal CHANGELOG.md
  # links, so Renovate fetches them at source. This is the dominant heap +
  # API consumer — if the job OOMs at the 1Gi cap, raise memory before
  # turning this off again.
  RENOVATE_FETCH_CHANGE_LOGS: "pr"
