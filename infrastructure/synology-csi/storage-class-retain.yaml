apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-iscsi-retain
  annotations:
provisioner: csi.san.synology.com
parameters:
  dsm: "192.168.0.100"
  location: "/volume1"
  protocol: iscsi
  fsType: ext4
  # Skip mkfs's full-device discard — on a large iSCSI LUN it writes the whole
  # volume and blows the CSI node-stage deadline (mkfs then loops, never mounting).
  formatOptions: "-E nodiscard"
reclaimPolicy: Retain
allowVolumeExpansion: true
