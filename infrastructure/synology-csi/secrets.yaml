apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-sci-client-info-secret
  namespace: synology-csi
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: client-info-secret
    template:
      data:
        client-info.yml: |
          clients:
            - host: {{ .synologyHost }}
              port: {{ .synologyPort }}
              https: {{ .synologyHttps }}
              username: {{ .synologyUsername }}
              password: {{ .synologyPassword }}
  data:
    - secretKey: synologyHost
      remoteRef:
        key: synology-host
    - secretKey: synologyPort
      remoteRef:
        key: synology-port
    - secretKey: synologyHttps
      remoteRef:
        key: synology-https
    - secretKey: synologyUsername
      remoteRef:
        key: synology-username
    - secretKey: synologyPassword
      remoteRef:
        key: synology-password
