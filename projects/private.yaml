apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: private
  namespace: argocd

spec:
  description: "Private application deployments"

  sourceRepos:
    - https://github.com/bde-dev/private-cluster.git

  destinations:
    - namespace: "argocd"
      server: https://kubernetes.default.svc
    - namespace: "*"
      name: "private-cluster"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
