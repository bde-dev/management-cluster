apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: private
  namespace: argocd

spec:
  description: "Private application deployments"

  sourceRepos:
    - https://github.com/bde-dev/private-cluster.git

  destinations:
    - namespace: "n8n"
      name: "private-cluster"
    - namespace: "paperless"
      name: "private-cluster"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
