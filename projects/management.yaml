apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: management
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  description: "Management Project - Cross-cluster Workloads and Dependencies"

  sourceRepos:
    - https://argoproj.github.io/argo-helm
    - https://github.com/bde-dev/management-cluster.git

  destinations:
    - namespace: "argocd"
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
