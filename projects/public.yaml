apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: public
  namespace: argocd

spec:
  description: "Public application deployments"

  sourceRepos:
    - https://github.com/bde-dev/public-cluster.git

  destinations:
    - namespace: "argocd"
      server: https://kubernetes.default.svc
    - namespace: "*"
      name: "public-cluster"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
