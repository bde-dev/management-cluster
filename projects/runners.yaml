apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: runners
  namespace: argocd

spec:
  description: "GitHub Actions runner deployments"

  sourceRepos:
    - https://github.com/bde-dev/runners-cluster.git
    - ghcr.io/actions/actions-runner-controller-charts

  destinations:
    - namespace: "arc-systems"
      name: "runners-cluster"
    - namespace: "arc-runners"
      name: "runners-cluster"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
